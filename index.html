<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loyalty card</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F5;--card:#1B2A41;--card-ink:#F3F6FA;--stamp-empty:#2C3F5E;--gold:#F2B33D;--ink:#1B2A41;--muted:#5A6B84;--ok:#1E7A55;--err:#B3372B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--card:#1B2A41;--ink:#E8EDF5;--muted:#93A3BC;--ok:#58C79A;--err:#FF8A7A}}
:root[data-theme="dark"]{--bg:#0E1420;--card:#1B2A41;--ink:#E8EDF5;--muted:#93A3BC;--ok:#58C79A;--err:#FF8A7A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);color:var(--card-ink);border-radius:22px;padding:22px 20px 20px;box-shadow:0 10px 30px rgba(10,20,40,.25)}
.count{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.count b{font-size:3rem;font-weight:800;line-height:1;color:var(--gold)}
.count span{opacity:.8}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stamp{aspect-ratio:1;border-radius:50%;background:var(--stamp-empty);display:grid;place-items:center;font-weight:600;color:#7f93b3;font-size:.9rem;border:2px dashed #46608a}
.stamp.on{background:var(--gold);color:var(--card);border:2px solid var(--gold)}
.stamp.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stamp svg{width:55%;height:55%}
.reward{margin-top:16px;font-size:.95rem;opacity:.9}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:16px;width:100%;cursor:pointer;margin-top:16px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#tap{background:var(--gold);color:#1B2A41;font-size:1.05rem}
#tap[disabled]{opacity:.6;cursor:default}
#redeem{background:var(--ok);color:#fff;display:none}
#redeem.show{display:block}
.status{min-height:1.5em;margin:14px 2px 0;font-size:.95rem;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}
.foot{color:var(--muted);font-size:.8rem;margin-top:22px}
@media (prefers-reduced-motion:reduce){.stamp.pop{animation:none}}
</style>
</head>
<body>
<main>
  <h1>Your loyalty card</h1>
  <p class="sub">Tap your waiter’s card with your phone to earn a point.</p>

  <section class="card" aria-label="Loyalty card">
    <div class="count"><b id="pts">0</b><span>of 8 points</span></div>
    <div class="grid" id="grid"></div>
    <div class="reward" id="reward"></div>
    <button id="tap">Tap waiter’s card</button>
    <button id="redeem">Redeem free reward</button>
  </section>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <p class="foot" id="foot"></p>
</main>

<script>
(function(){
  var WAITER_SERIAL="04F4A959CE2A81";   // waiter NFC card serial
  var GOAL=8;                            // points for a reward
  var COOLDOWN_MIN=5;                    // minutes between points
  var KEY="loyalty-card-v1";

  var state={points:0,redeemed:0,last:0};
  try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&typeof s.points==="number")state=s;}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var $=function(id){return document.getElementById(id)};
  var grid=$("grid"),pts=$("pts"),statusEl=$("status"),tap=$("tap"),redeem=$("redeem"),reward=$("reward");
  var check='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function render(popIndex){
    pts.textContent=state.points;
    grid.innerHTML="";
    for(var i=0;i<GOAL;i++){
      var d=document.createElement("div");
      d.className="stamp"+(i<state.points?" on":"")+(i===popIndex?" pop":"");
      d.innerHTML=i<state.points?check:(i+1);
      grid.appendChild(d);
    }
    var left=GOAL-state.points;
    reward.textContent=left>0?(left+" more "+(left===1?"point":"points")+" for a free reward."):"You’ve earned a free reward!";
    redeem.className=left<=0?"show":"";
    tap.style.display=left<=0?"none":"block";
    $("foot").textContent=state.redeemed?("Rewards redeemed so far: "+state.redeemed):"";
  }
  function say(msg,type){statusEl.textContent=msg;statusEl.className="status"+(type?" "+type:"");}
  function norm(s){return String(s||"").replace(/[^0-9a-f]/gi,"").toUpperCase();}

  function handle(serial){
    if(norm(serial)!==WAITER_SERIAL){say("Card read, but the serial doesn’t match. Read: "+(serial||"(none)")+". Expected: 04:F4:A9:59:CE:2A:81.","err");return;}
    if(state.points>=GOAL){return;}
    state.points++;state.last=Date.now();save();
    try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}
    render(state.points-1);
    say("Point added! "+state.points+" of "+GOAL+".","ok");
  }

  var scanning=false;
  tap.addEventListener("click",async function(){
    if(!("NDEFReader" in window)){
      say("This browser can’t read NFC. Open this page in Chrome on an Android phone with NFC turned on.","err");return;
    }
    if(scanning){return;}
    try{
      var reader=new NDEFReader();
      await reader.scan();
      scanning=true;tap.disabled=true;tap.textContent="Hold phone to waiter’s card…";
      say("Ready. Hold the back of your phone against the card.");
      reader.onreading=function(ev){handle(ev.serialNumber);};
      reader.onreadingerror=function(){say("Card detected but couldn’t be read as an NDEF tag. Some cards (e.g. MIFARE Classic) aren’t supported by Chrome.","err");};
    }catch(err){
      scanning=false;tap.disabled=false;
      say(err&&err.name==="NotAllowedError"?"NFC permission was denied. Allow it in your browser’s site settings.":"Couldn’t start NFC. Check that NFC is on and try again.","err");
    }
  });

  redeem.addEventListener("click",function(){
    state.points=0;state.redeemed++;state.last=0;save();
    scanning=false;tap.disabled=false;tap.textContent="Tap waiter’s card";
    render();say("Reward redeemed. A new card has started.","ok");
  });

  render();
  if(window.self!==window.top){say("This page is inside a frame, where NFC is blocked. Open the link directly in Chrome on Android.","err");}
  else if(!("NDEFReader" in window)){say("NFC isn’t available in this browser. Use Chrome on Android.","err");}
})();
</script>
</body>
</html>
